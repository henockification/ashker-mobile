# EAS workflow: create production builds
# Configure in EAS project settings and run via: pnpm build:prod
name: Create Production Builds
jobs:
  android_device_production_build:
    environment: production
    name: Build Android Device (production)
    type: build
    params:
      platform: android
      profile: production

  ios_device_production_build:
    environment: production
    name: Build iOS Device (production)
    type: build
    params:
      platform: ios
      profile: production
